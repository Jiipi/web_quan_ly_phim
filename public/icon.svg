<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#ff2a85" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <!-- Outer Film Strip Frame -->
  <rect width="18" height="18" x="3" y="3" rx="3.5" stroke="#ff2a85" stroke-width="2" />
  
  <!-- Vertical Side Rails -->
  <line x1="7" y1="3" x2="7" y2="21" stroke="#ff2a85" stroke-width="1.8" />
  <line x1="17" y1="3" x2="17" y2="21" stroke="#ff2a85" stroke-width="1.8" />
  
  <!-- Middle Dividing Line -->
  <line x1="7" y1="12" x2="17" y2="12" stroke="#ff2a85" stroke-width="2" />
  
  <!-- Left Side Sprocket Holes (4 slots) -->
  <line x1="3" y1="5.5" x2="7" y2="5.5" stroke="#ff2a85" stroke-width="1.5" />
  <line x1="3" y1="9.5" x2="7" y2="9.5" stroke="#ff2a85" stroke-width="1.5" />
  <line x1="3" y1="14.5" x2="7" y2="14.5" stroke="#ff2a85" stroke-width="1.5" />
  <line x1="3" y1="18.5" x2="7" y2="18.5" stroke="#ff2a85" stroke-width="1.5" />
  
  <!-- Right Side Sprocket Holes (4 slots) -->
  <line x1="17" y1="5.5" x2="21" y2="5.5" stroke="#ff2a85" stroke-width="1.5" />
  <line x1="17" y1="9.5" x2="21" y2="9.5" stroke="#ff2a85" stroke-width="1.5" />
  <line x1="17" y1="14.5" x2="21" y2="14.5" stroke="#ff2a85" stroke-width="1.5" />
  <line x1="17" y1="18.5" x2="21" y2="18.5" stroke="#ff2a85" stroke-width="1.5" />
</svg>
